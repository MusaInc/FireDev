<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, initial-scale=1">
  <title>FireDev</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="stage">
    <div id="screen"></div>
    <div id="overlays"></div>
    <div id="toast" class="toast" aria-live="polite"></div>
  </div>
  <div id="boot">Starting FireDev…</div>
  <script>
    // Plain ES5 on purpose: if the app bundle fails on this device's WebView, say so on screen instead of a blank TV.
    window.onerror = function (msg, src, line) {
      var b = document.getElementById('boot');
      if (b) { b.className = 'failed'; b.textContent = 'FireDev could not start: ' + msg + ' (' + String(src).split('/').pop() + ':' + line + ')'; }
    };
  </script>
  <script src="dist/app.js"></script>
</body>
</html>
